[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-pipeline"
version = "0.1.0"
description = "Work-in-progress governed data pipeline for a wider credit-risk analytics system"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "openpyxl",
    "pyarrow"
]

[tool.setuptools.packages.find]
where = ["src"]
